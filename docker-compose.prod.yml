# ponytail: single-instance default (throttle + tick in-memory). Jangan scale api >1
# tanpa Redis/advisory eksternal — lihat docs/DECISIONS.md. Ceiling: 150 user serentak OK.
x-logging: &log
  driver: json-file
  options:
    max-size: "10m"
    max-files: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *log
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jurnalistik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jurnalistik}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jurnalistik}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *log
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jurnalistik}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jurnalistik}?schema=public
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET min 32 karakter}
      WEB_URL: ${WEB_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      UPLOAD_DIR: /srv/uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-r2}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      MEETING_TICK_MS: ${MEETING_TICK_MS:-60000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      API_PUBLIC_URL: ${API_URL:-}
      FILE_HMAC_SECRET: ${FILE_HMAC_SECRET:?isi FILE_HMAC_SECRET min 32 karakter}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:?isi QR_HMAC_SECRET min 32 karakter}
      TOTP_ENC_KEY: ${TOTP_ENC_KEY:?isi TOTP_ENC_KEY min 32 karakter}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/srv/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?isi site key Turnstile (Cloudflare dashboard)}
    restart: unless-stopped
    logging: *log
    environment:
      API_URL: http://api:3000
      ALLOWED_ORIGINS: ${ADMIN_URL:?isi ADMIN_URL, mis. https://admin.contoh.id}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?isi secret key Turnstile (Cloudflare dashboard)}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3102"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3102/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *log
    environment:
      API_URL: ${API_URL:?isi API_URL, mis. https://api.contoh.id}
      ADMIN_URL: ${ADMIN_URL:?isi ADMIN_URL, mis. https://admin.contoh.id}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
